name: build

# 什么时候跑：
#   · 手动（Actions 页面点 Run workflow）
#   · 打 tag（v1.0.0 之类）→ 顺便把打包好的 zip 作为 Release 附件发出去
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write          # 打 tag 时创建 Release 需要

jobs:
  # ---------------------------------------------------------------- 单元测试
  unit:
    name: 单元测试（CI 可跑的那一部分）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法自检（先快速失败，别等打包完才发现语法错）
        run: python -m compileall -q core detection leigod ui game launcher diagnostics main.py

      # 只跑"纯逻辑"这一套。其余 7 套需要**真实桌面 + 真机上的目标客户端**
      # （它们要创建真窗口、提权、点真按钮），CI 上跑不了。
      # continue-on-error：这台 runner 上偶发的环境差异不该把 CI 标红，
      # 但它仍会打印结果，方便你判断。
      - name: 单元测试
        continue-on-error: true
        run: python tests/run_all.py units

  # ---------------------------------------------------------------- 打包
  build:
    name: 打包 Windows exe
    runs-on: windows-latest
    needs: unit
    if: always()             # 单元测试偶发失败也照样出包，方便人工验证
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # 注意：**不要加 --clean / --noconfirm 之外的东西**，也不要指望它能清掉旧产物；
      # 两个 spec 分别输出到 dist/<name>/，正是后面要打的包。
      - name: 打包（图形版）
        run: pyinstaller packaging/LeigodGuard.spec

      - name: 打包（控制台版 = 诊断入口）
        run: pyinstaller packaging/LeigodGuardCUI.spec

      - name: 把控制台版并进同目录（交付形态要求两个 exe 在一起）
        shell: pwsh
        run: Copy-Item dist/LeigodGuardCUI/LeigodGuardCUI.exe dist/LeigodGuard/ -Force

      - name: 校验产物里真的带了 OCR 模型
        shell: pwsh
        run: |
          $n = (Get-ChildItem -Recurse -Filter *.onnx dist/LeigodGuard | Measure-Object).Count
          Write-Host "onnx 模型数量: $n"
          if ($n -lt 3) { throw "OCR 模型没打进包（应为 3 个）—— 检查 spec 里的 collect_data_files" }

      - name: 打 zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag) { $tag = "dev" }
          Compress-Archive -Path dist/LeigodGuard/* -DestinationPath "LeigodGuard-$tag.zip" -CompressionLevel Optimal

      - uses: actions/upload-artifact@v4
        with:
          name: LeigodGuard-windows
          path: LeigodGuard-*.zip
          retention-days: 14

      # 打 tag 时顺带发 Release（用 runner 自带的 gh，不引第三方 action）
      - name: 发布 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" LeigodGuard-*.zip `
            --title "${{ github.ref_name }}" `
            --generate-notes `
            --notes "下载 zip → 解压 → 双击 立刻待命.bat（会弹一次 UAC，原因见 README）。"
